<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐋 Nansen Whale Radar</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#02040a; color:#cfe8ff; font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; height:100vh; }
  #hud { position:fixed; top:0; left:0; right:0; padding:14px 22px; display:flex; justify-content:space-between; align-items:center; z-index:10; background:linear-gradient(180deg,rgba(2,4,10,.92),transparent); }
  #hud h1 { font-size:17px; letter-spacing:3px; color:#7fd4ff; text-transform:uppercase; }
  #hud h1 b { color:#ffd700; }
  #stats { display:flex; gap:18px; font-size:12px; color:#8ab6d6; }
  .stat b { color:#e8f6ff; font-size:15px; display:block; }
  #legend { position:fixed; bottom:16px; left:20px; font-size:12px; color:#8ab6d6; z-index:10; }
  .lg { display:flex; align-items:center; gap:7px; margin-top:5px; }
  .dot { width:9px; height:9px; border-radius:50%; box-shadow:0 0 8px currentColor; }
  #flows-legend { position:fixed; bottom:16px; right:20px; font-size:12px; color:#8ab6d6; z-index:10; text-align:right; }
  #tooltip { position:fixed; pointer-events:none; background:rgba(4,10,22,.95); border:1px solid #1c4a6e; border-radius:9px; padding:10px 13px; font-size:12px; display:none; z-index:20; max-width:280px; box-shadow:0 4px 22px rgba(0,0,0,.6); }
  #tooltip .addr { color:#7fd4ff; font-family:monospace; font-size:11px; word-break:break-all; }
  #tooltip .pts { color:#ffd700; font-size:15px; font-weight:600; margin:4px 0; }
  #tooltip .tok { color:#7ee787; font-size:14px; font-weight:600; }
  #tooltip .flow-pos { color:#7ee787; }
  #tooltip .flow-neg { color:#ff8a80; }
  #scan { position:fixed; top:60px; right:20px; font-size:11px; color:#5a8aa8; z-index:10; text-align:right; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="hud">
  <h1>🐋 Nansen <b>Whale Radar</b></h1>
  <div id="stats">
    <div class="stat">Wallets<b id="s-wallets">—</b></div>
    <div class="stat">Total Points<b id="s-pts">—</b></div>
    <div class="stat">⭐ Star<b id="s-star">—</b></div>
    <div class="stat">Whale Blips<b id="s-blips">—</b></div>
    <div class="stat">Token Flows<b id="s-flows">—</b></div>
  </div>
</div>
<div id="scan">SCAN: <span id="scan-line">0°</span><br>SWEEP: <span id="sweep-count">0</span><br>DATA: <span id="data-src">—</span></div>
<div id="legend">
  <div class="lg"><span class="dot" style="color:#FFD700;background:#FFD700"></span>Star (250K+ pts)</div>
  <div class="lg"><span class="dot" style="color:#4FC3F7;background:#4FC3F7"></span>North (50K+)</div>
  <div class="lg"><span class="dot" style="color:#80DEEA;background:#80DEEA"></span>Ice (10K+)</div>
</div>
<div id="flows-legend">
  <div class="lg" style="justify-content:flex-end"><span class="dot" style="color:#7ee787;background:#7ee787"></span>Net inflow (24h)</div>
  <div class="lg" style="justify-content:flex-end"><span class="dot" style="color:#ff8a80;background:#ff8a80"></span>Net outflow (24h)</div>
  <div style="margin-top:4px;color:#5a8aa8">outer ring = token flows</div>
</div>
<div id="tooltip"></div>
<canvas id="radar"></canvas>
<script>
const TIER = { Star:{c:"#FFD700",r:5.2}, North:{c:"#4FC3F7",r:4.1}, Ice:{c:"#80DEEA",r:2.7} };
const cv = document.getElementById("radar"), ctx = cv.getContext("2d");
const tip = document.getElementById("tooltip");
let W,H,CX,CY,R, whales=[], blips=[], flows=[], flowMarks=[], angle=0, sweeps=0, hoverBlip=null, hoverFlow=null;

function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; CX=W/2; CY=H/2+20; R=Math.min(W,H)/2-80; }
addEventListener("resize", ()=>{ resize(); placeAll(); }); resize();

const fmt = n => n>=1e6 ? (n/1e6).toFixed(2)+"M" : n>=1e3 ? (n/1e3).toFixed(1)+"K" : n;
const fmtSigned = n => (n>=0?"+":"−")+fmt(Math.abs(n));

function placeAll(){
  blips = [];
  const golden = Math.PI*(3-Math.sqrt(5));
  whales.forEach((w,i)=>{
    const t = i/Math.max(whales.length-1,1);
    const a = i*golden;
    const rr = Math.pow(t,0.62)*R*0.72; // whales live inside 72% radius; outer ring = flows
    blips.push({x:CX+Math.cos(a)*rr, y:CY+Math.sin(a)*rr, w});
  });
  flowMarks = [];
  flows.forEach((f,i)=>{
    const a = (i/flows.length)*Math.PI*2*3; // 3 wraps to spread
    const mag = Math.min(Math.abs(f.net_24h)/50000, 1); // normalized
    const rr = R*0.80 + mag*R*0.17;
    flowMarks.push({x:CX+Math.cos(a)*rr, y:CY+Math.sin(a)*rr, f});
  });
}

async function load(){
  const src = document.getElementById("data-src");
  const day = new Date().toISOString().slice(0,10).replace(/-/g,"");
  // 1) whale snapshot
  let whaleData = null;
  for(const f of ["data/radar_"+day+".json","data/radar_20260918.json"]){
    try{ const r = await fetch(f); if(r.ok){ whaleData = await r.json(); src.textContent="snapshot"; break; } }catch(e){}
  }
  if(!whaleData){
    try{
      const r = await fetch("https://app.nansen.ai/api/points-leaderboard");
      const raw = await r.json();
      const tiers={}; raw.forEach(u=>tiers[u.tier]=(tiers[u.tier]||0)+1);
      whaleData = { total_wallets:raw.length, total_points:raw.reduce((s,u)=>s+u.points,0), tiers,
        whales: raw.filter(u=>TIER[u.tier]).sort((a,b)=>b.points-a.points).slice(0,600)
          .map(u=>({address:(u.evm_address||u.solana_address||"?"),points:u.points,rank:u.rank,tier:u.tier})) };
      src.textContent="live API";
    }catch(e){ src.textContent="offline"; }
  }
  if(whaleData){
    whales = whaleData.whales;
    document.getElementById("s-wallets").textContent = fmt(whaleData.total_wallets);
    document.getElementById("s-pts").textContent = fmt(whaleData.total_points);
    document.getElementById("s-star").textContent = whaleData.tiers?.Star ?? 0;
    document.getElementById("s-blips").textContent = whales.length;
  }
  // 2) token flows layer
  for(const f of ["data/flows_"+day+".json","data/flows_20260918.json"]){
    try{ const r = await fetch(f); if(r.ok){ const d = await r.json(); flows = d.flows||[]; break; } }catch(e){}
  }
  document.getElementById("s-flows").textContent = flows.length;
  placeAll();
  requestAnimationFrame(draw);
}

function draw(){
  ctx.fillStyle = "rgba(2,4,10,0.28)"; ctx.fillRect(0,0,W,H);
  // rings
  ctx.strokeStyle="rgba(28,74,110,0.34)"; ctx.fillStyle="#3d6a8c"; ctx.font="10px monospace"; ctx.lineWidth=1;
  [0.25,0.5,0.75,1].forEach(f=>{ ctx.beginPath(); ctx.arc(CX,CY,R*f,0,7); ctx.stroke(); });
  ctx.fillText("WHALE CORE", CX-34, CY-R*0.25-6);
  ctx.fillText("MID FIELD", CX-28, CY-R*0.75-6);
  ctx.fillText("TOKEN FLOW RING", CX-52, CY-R-8);
  ctx.strokeStyle="rgba(28,74,110,0.22)";
  ctx.beginPath(); ctx.moveTo(CX-R,CY); ctx.lineTo(CX+R,CY); ctx.moveTo(CX,CY-R); ctx.lineTo(CX,CY+R); ctx.stroke();
  // sweep
  angle += 0.012;
  if(angle > Math.PI*2){ angle -= Math.PI*2; sweeps++; document.getElementById("sweep-count").textContent=sweeps; }
  document.getElementById("scan-line").textContent = Math.round(angle*180/Math.PI)+"°";
  ctx.save(); ctx.translate(CX,CY); ctx.rotate(angle);
  const g = ctx.createLinearGradient(0,0,R,0);
  g.addColorStop(0,"rgba(127,212,255,0.30)"); g.addColorStop(1,"rgba(127,212,255,0)");
  ctx.fillStyle=g; ctx.moveTo(0,0); ctx.arc(0,0,R,-0.09,0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle="rgba(127,212,255,0.5)"; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(R,0); ctx.stroke();
  ctx.restore();
  // flow marks (outer ring) — green inflow, red outflow
  flowMarks.forEach(m=>{
    const inflow = m.f.net_24h >= 0;
    const c = inflow ? "#7ee787" : "#ff8a80";
    const size = 1.8 + Math.min(Math.abs(m.f.net_24h)/60000,1)*4.5;
    let d = angle - Math.atan2(m.y-CY, m.x-CX); d = ((d%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    const ping = Math.max(0, 1 - d/0.9);
    const glow = 0.30 + 0.70*ping;
    ctx.beginPath(); ctx.arc(m.x,m.y,size,0,7);
    ctx.fillStyle=c; ctx.globalAlpha=glow; ctx.shadowColor=c; ctx.shadowBlur=10*ping+4; ctx.fill();
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    // streak toward/away from center: inflow dashes inward, outflow outward
    if(ping>0.5){
      const ang = Math.atan2(m.y-CY,m.x-CX);
      const len = size*3.2*(inflow?-1:1);
      ctx.strokeStyle=c; ctx.globalAlpha=(ping-0.5)*1.4;
      ctx.beginPath();
      ctx.moveTo(m.x+Math.cos(ang)*size*1.4, m.y+Math.sin(ang)*size*1.4);
      ctx.lineTo(m.x+Math.cos(ang)*(size*1.4+len), m.y+Math.sin(ang)*(size*1.4+len));
      ctx.stroke(); ctx.globalAlpha=1;
    }
  });
  // whale blips
  blips.forEach(b=>{
    const t = TIER[b.w.tier];
    let d = angle - Math.atan2(b.y-CY, b.x-CX); d = ((d%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    const ping = Math.max(0, 1 - d/0.9);
    const glow = 0.35 + 0.65*ping;
    ctx.beginPath(); ctx.arc(b.x, b.y, t.r*(0.8+0.5*ping), 0, 7);
    ctx.fillStyle = t.c; ctx.globalAlpha = glow;
    ctx.shadowColor = t.c; ctx.shadowBlur = 14*ping + 5;
    ctx.fill(); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    if(ping>0.85 && b.w.tier==="Star"){
      ctx.beginPath(); ctx.arc(b.x,b.y, t.r+(1-ping)*26, 0,7);
      ctx.strokeStyle=t.c; ctx.globalAlpha=(1-ping)*0.7; ctx.stroke(); ctx.globalAlpha=1;
    }
  });
  if(hoverBlip){
    const b=hoverBlip, t=TIER[b.w.tier];
    ctx.beginPath(); ctx.arc(b.x,b.y,t.r+7,0,7);
    ctx.strokeStyle="#fff"; ctx.lineWidth=1.5; ctx.stroke(); ctx.lineWidth=1;
  }
  if(hoverFlow){
    const m=hoverFlow;
    ctx.beginPath(); ctx.arc(m.x,m.y,9,0,7);
    ctx.strokeStyle="#fff"; ctx.lineWidth=1.5; ctx.stroke(); ctx.lineWidth=1;
  }
  requestAnimationFrame(draw);
}

cv.addEventListener("mousemove", e=>{
  hoverBlip=null; hoverFlow=null;
  for(const m of flowMarks){ if(Math.hypot(e.clientX-m.x, e.clientY-m.y) < 9){ hoverFlow=m; break; } }
  if(!hoverFlow) for(const b of blips){ if(Math.hypot(e.clientX-b.x, e.clientY-b.y) < 9){ hoverBlip=b; break; } }
  if(hoverBlip){
    const w=hoverBlip.w;
    tip.style.display="block";
    tip.style.left=Math.min(e.clientX+16, innerWidth-300)+"px";
    tip.style.top=(e.clientY+10)+"px";
    tip.innerHTML = `<div class="addr">${w.address}</div>
      <div class="pts">${fmt(w.points)} pts</div>
      <div>Rank #${w.rank} · Tier: ${w.tier}</div>`;
    document.body.style.cursor="pointer";
  } else if(hoverFlow){
    const f=hoverFlow.f;
    tip.style.display="block";
    tip.style.left=Math.min(e.clientX+16, innerWidth-300)+"px";
    tip.style.top=(e.clientY+10)+"px";
    tip.innerHTML = `<div class="tok">${f.token} <span style="color:#5a8aa8">(${f.chain})</span></div>
      <div>Smart Money net flow 24h: <b class="${f.net_24h>=0?'flow-pos':'flow-neg'}">${fmtSigned(f.net_24h)} USD</b></div>
      <div>7d: <b class="${f.net_7d>=0?'flow-pos':'flow-neg'}">${fmtSigned(f.net_7d)} USD</b></div>
      <div>${f.traders} smart traders</div>`;
    document.body.style.cursor="pointer";
  } else { tip.style.display="none"; document.body.style.cursor="default"; }
});
load();
</script>
</body>
</html>
