app = "exit-window"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  APP_URL = "https://exit-window.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "exit_window_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
